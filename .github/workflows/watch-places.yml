# Daily watch of the official hours / closing-day pages behind places.json.
# If a page changed since yesterday the run fails, GitHub emails the repo owner,
# and reports/place-watch.md (attached to the run) shows the changed lines.
# Yesterday's snapshots are kept in the Actions cache — nothing is committed.
name: Watch place hours

on:
  schedule:
    - cron: "10 0 * * *" # 09:10 KST, after the link check
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .watch
          key: place-watch-${{ github.run_id }}
          restore-keys: place-watch-
      - run: python3 scripts/watch_places.py --state .watch
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .watch
          key: place-watch-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-watch-report
          path: reports/place-watch.md
